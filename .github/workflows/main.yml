name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Este projeto não depende de outros pacotes no GitHub Packages; só nuget.org.
      - name: Restore dependencies
        run: dotnet restore Pluma.Library.InternalServiceAuth.sln

      - name: Build project
        run: dotnet build Pluma.Library.InternalServiceAuth.sln --configuration Release --no-restore

      - name: Extract Version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Pack project
        run: dotnet pack Pluma.Library.InternalServiceAuth/Pluma.Library.InternalServiceAuth.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ steps.get_version.outputs.VERSION }}

      # GITHUB_TOKEN com packages:write publica no GitHub Packages sem PACKAGES_TOKEN.
      # Opcional: definir PACKAGES_TOKEN (PAT) no repo e trocar abaixo se quiseres alinhar às outras libs Pluma.
      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
