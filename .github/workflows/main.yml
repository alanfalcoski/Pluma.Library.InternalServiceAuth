name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          # O runner pode já ter uma origem com o nome "github" (ex.: imagem/setup-dotnet).
          dotnet nuget remove source github 2>/dev/null || true
          dotnet nuget add source --username alanfalcoski --password ${{ secrets.PACKAGES_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/alanfalcoski/index.json"
          dotnet restore Pluma.Library.InternalServiceAuth.sln

      - name: Build project
        run: dotnet build Pluma.Library.InternalServiceAuth.sln --configuration Release --no-restore

      - name: Extract Version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Pack project
        run: dotnet pack Pluma.Library.InternalServiceAuth/Pluma.Library.InternalServiceAuth.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ steps.get_version.outputs.VERSION }}

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.PACKAGES_TOKEN }} --skip-duplicate
